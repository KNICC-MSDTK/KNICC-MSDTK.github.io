    weight: 20
  - name: 구성원
    identifier: members
    url: /researchers/
    weight: 30
  - name: Researchers
    url: /researchers/
    parent: members
    weight: 31
  - name: Students
    url: /students/
    parent: members
    weight: 32
  - name: Alumni
    url: /alumni/
    parent: members
    weight: 33
  - name: 프로젝트
    url: projects/
    weight: 40
  - name: 발간물
    url: publications/
    weight: 50
  - name: 문의
