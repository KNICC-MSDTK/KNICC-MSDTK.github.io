# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#     desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.
#   `identifier` / `parent` create a dropdown submenu (standard Hugo menu nesting).

main:
  - name: HOME
    url: /
    weight: 10
  - name: PEOPLE
    identifier: members
    url: /researchers/
    weight: 20
  - name: Researchers
    url: /researchers/
    parent: members
    weight: 21
  - name: Students
    url: /students/
    parent: members
    weight: 22
  - name: Alumni
    url: /alumni/
    parent: members
    weight: 23
  - name: RESEARCH
    identifier: projects
    url: /projects-current/
    weight: 30
  - name: Current Projects
    url: /projects-current/
    parent: projects
    weight: 31
  - name: Completed Projects
    url: /projects-completed/
    parent: projects
    weight: 32
  - name: PUBLICATIONS
    url: publications/
    weight: 40
  - name: NEWS
    url: /news/
    weight: 50
